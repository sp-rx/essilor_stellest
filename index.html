<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Essilor Stellest</title>

 <style>
body {
  margin: 0;
  padding: 1.5rem;
  background: #101e3b;
  display: flex;
  justify-content: center;
  font-family: Montserrat, sans-serif;
  box-sizing: border-box;
}

*,
*::before,
*::after {
  box-sizing: inherit;
}

.container {
  width: 100%;
  max-width: 840px;
}

img {
  width: 100%;
  height: auto;
  display: block;
}

.img-wrap {
  position: relative;
}

.price {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);

  width: calc(100% - 3rem);
  max-width: 840px;

  background: rgba(20, 20, 20, 0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  padding: 16px 24px;
  border-radius: 14px;

  color: #fff;
  z-index: 999;

  font-family: Arial, sans-serif;
  letter-spacing: 1px;

  box-shadow: 0 10px 30px rgba(0,0,0,0.25);
  border: 1px solid rgba(255,255,255,0.08);

  font-size: 20px;
}

.row {
  width: 100%;
  display: flex;
  justify-content: space-between;
  gap: 24px;
  margin: 8px 0;
  font-size: 10px;
}

.label {
  opacity: 0.85;
  font-weight: 400;
}

.value {
  font-weight: 600;
  white-space: nowrap;
}

.note {
  width: 100%;
  margin-top: 18px;
  font-size: 8px;
  opacity: 0.75;
  line-height: 1.3;
}

.disclaimer {
  width: 100%;
  margin-top: 10px;
  font-size: 7px;
  opacity: 0.55;
  line-height: 1.35;
}

.disclaimer strong {
  font-weight: 600;
}
</style>
</head>
<body>

<div class="price">
  <div class="row">
    <span class="label">Stellest UV400</span>
    <span class="value">RM 1,400</span>
  </div>

  <div class="row">
    <span class="label">Stellest Prevencia</span>
    <span class="value">RM 1,600</span>
  </div>


  <div class="note">
    All lenses come with UV protection. Price quoted in pair.
  </div>


</div>

<div class="container">
  <img src="https://sp-rx.github.io/essilor_stellest/2.png">
  <img src="https://sp-rx.github.io/essilor_stellest/3.png">
  <img src="https://sp-rx.github.io/essilor_stellest/1.png">
  <img src="https://sp-rx.github.io/essilor_stellest/5.png">
  <img src="https://sp-rx.github.io/essilor_stellest/7.png">
  <img src="https://sp-rx.github.io/essilor_stellest/6.png">

<div style="height:150px"></div>

</div>


  </div>

  
</body>
</html>
